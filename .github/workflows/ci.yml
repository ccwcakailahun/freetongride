name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/FreeTongRide.slnx -c Release

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx ng build

  mobile:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile/packages/ftr_core
      - run: flutter analyze
        working-directory: mobile/packages/ftr_core
      - run: flutter pub get && flutter analyze
        working-directory: mobile/passenger
      - run: flutter pub get && flutter analyze
        working-directory: mobile/driver
